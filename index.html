<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#EEF1F5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0D1224" media="(prefers-color-scheme: dark)" />
    <title>Figure Viewer</title>
    <script>
      // Resolve the theme before first paint so a dark preference never
      // flashes light. Mirrors SettingsProvider: 'system' follows the OS.
      try {
        var pref = localStorage.getItem('theme');
        if (pref !== 'light' && pref !== 'dark') pref = 'system';
        var dark = pref === 'dark' || (pref === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      } catch (e) {
        document.documentElement.dataset.theme = 'light';
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
